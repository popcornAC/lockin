# Builds installers for Windows and macOS (Apple Silicon + Intel) and attaches
# them to a GitHub release. Trigger by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Bump "version" in app/src-tauri/tauri.conf.json and app/package.json first.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # NSIS .exe installer only; the MSI needs WiX and adds build time.
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows: skip Defender's real-time scanning and put cargo's target dir on
      # a ReFS Dev Drive. NTFS + Defender is the main reason Windows builds are slow.
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          trusted-dev-drive: true
          mount-path: ${{ github.workspace }}/app/src-tauri/target

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # Builds are unsigned (personal use). See plans/releases.md for first-launch steps.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Lockin ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Windows installer (.exe) and macOS builds (.dmg, aarch64 = Apple Silicon, x64 = Intel).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
