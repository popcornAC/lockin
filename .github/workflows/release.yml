# Builds installers for Windows and macOS (Apple Silicon + Intel) and attaches
# them to a GitHub release. Trigger by pushing a tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Bump "version" in app/src-tauri/tauri.conf.json, Cargo.toml and app/package.json first.
#
# Updater artifacts (.app.tar.gz, setup .exe) are signed with the updater key in
# the TAURI_SIGNING_PRIVATE_KEY secret (TAURI_SIGNING_PRIVATE_KEY_PASSWORD is
# unset: the key has no password). Each build job merges its platform into the
# release's latest.json, which the in-app updater reads.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # NSIS .exe installer only; the MSI needs WiX and adds build time.
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows: skip Defender's real-time scanning and put cargo's target dir on
      # a ReFS Dev Drive. NTFS + Defender is the main reason Windows builds are slow.
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          trusted-dev-drive: true
          mount-path: ${{ github.workspace }}/app/src-tauri/target

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # Installers aren't code signed (personal use); only the updater artifacts are.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Lockin ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Windows installer (.exe) and macOS builds (.dmg, aarch64 = Apple Silicon, x64 = Intel).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The build jobs update latest.json read-modify-write, so two finishing at the
  # same moment can drop a platform. Re-add any platform that's missing or stale
  # from the release's own assets, then fail if anything is still wrong.
  latest-json:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check and repair latest.json
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          gh release download "$TAG" -p latest.json -p '*.sig'
          names=$(gh release view "$TAG" --json assets -q '.assets[].name')
          cp latest.json before.json
          for p in darwin-aarch64:_aarch64.app.tar.gz darwin-x86_64:_x64.app.tar.gz windows-x86_64:_x64-setup.exe; do
            key=${p%%:*}
            file=$(grep -- "${p#*:}\$" <<<"$names")
            url="https://github.com/$GH_REPO/releases/download/$TAG/$file"
            jq --arg k "$key" --arg u "$url" --rawfile s "$file.sig" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > tmp.json && mv tmp.json latest.json
          done
          jq -e --arg v "${TAG#v}" '.version == $v' latest.json
          if ! cmp -s <(jq -S . before.json) <(jq -S . latest.json); then
            echo "latest.json was missing or had a stale platform entry; re-uploading"
            gh release upload "$TAG" latest.json --clobber
          fi
          jq '.platforms | map_values(.url)' latest.json
